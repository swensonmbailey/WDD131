<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Swenson Bailey">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read It BoM: Content Page</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/content.css">
    <script src="readitBoM.js" defer></script>
    
</head>
<body>
    <header>
        <div id="banner">
            <img id="logo" src="images/ReadItBoMLogo.jpg" alt="Read It BoM Logo">
            <h1>Read It BoM</h1>
        </div>
        <nav>
            <ul>
                <li><a  href="index.html">Home</a></li>
                <li><a  href="./content.html">Content</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Content</h2>
        <input type="text" placeholder="Search content" size="20" name="search" id="search">
        <div id="filters">
            <label>
            <input type="radio" name="category" value="all" checked>
            All
            </label>

            <label>
            <input type="radio" name="category" value="video">
            Videos
            </label>
        
            <label>
            <input type="radio" name="category" value="live">
            Lives
            </label>
        
            <label>
            <input type="radio" name="category" value="collab">
            Collabs
            </label>
             
        </div>


        <div id="videoContainer">
            
        </div>



        
        
    </main>
    <footer>
        <ul>
            <li><a href="https://www.youtube.com/@readitbom">YouTube</a></li>
            <li><a href="https://www.tiktok.com/@read.it.bom">TikTok</a></li>
            <li><a href="https://x.com/ReadItBOM">Twitter</a></li>
        </ul>
    </footer>
</body>
</html>
